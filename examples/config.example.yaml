
sftp:
  host: "sftp.example.com"
  port: 22
  username: "your-sftp-username"
  use_private_key: true
  # Store the private key in GCP Secret Manager and reference the secret name here
  private_key_secret_name: "projects/your-gcp-project/secrets/sftp-private-key/versions/latest"
  root_path: "/"

gcs:
  bucket: "my-sftp-listing-bucket"
  prefix: "sftp-listings/"
